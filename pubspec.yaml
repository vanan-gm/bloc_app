name: bloc_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  fpdart: ^1.1.1
  supabase_flutter: ^2.8.3
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  dotted_border: ^2.1.0
  image_picker: ^1.0.0
  cached_network_image: ^3.4.0
  uuid: ^4.5.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  internet_connection_checker: ^3.0.1
  path_provider: ^2.1.0
  rxdart: ^0.28.0
  flutter_staggered_grid_view: ^0.7.0
  easy_image_viewer: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
